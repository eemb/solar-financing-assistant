[project]
name = "solar-financing-assistant"
version = "0.1.0"
description = "Assistente conversacional para simulação de financiamento de energia solar"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.35",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_financing_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: marks tests as integration (requires network access)"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["solar_financing_assistant"]
