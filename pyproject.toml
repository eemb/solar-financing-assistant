[project]
name = "solar-financing-assistant"
version = "0.1.0"
description = "Backend for residential solar financing simulation (OCR → PV sizing → Price financing) exposed via a FastAPI REST API and an OpenAI tool-calling agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Eile" }]
keywords = ["solar", "financing", "fastapi", "hexagonal-architecture", "openai", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.35",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/eemb/solar-financing-assistant"
Repository = "https://github.com/eemb/solar-financing-assistant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_financing_assistant"]
# Ship the PEP 561 marker so downstream consumers get the inline type hints.
[tool.hatch.build.targets.wheel.force-include]
"src/solar_financing_assistant/py.typed" = "solar_financing_assistant/py.typed"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: marks tests as integration (requires network access)"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["solar_financing_assistant"]
